# MkDocs site — public documentation (English under docs/en). Build: pip install -e '.[docs]' && mkdocs build
site_name: ADN Systems
site_description: ADN DMR Peer Server, ADN Monitor, HBP, OpenBridge, self-service.
site_author: ADN Server contributors

docs_dir: docs/en
site_dir: site/en

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2

markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details

nav:
  - Home: README.md
  - Server (peer):
      - User guide:
          - Introduction: server/user-guide/introduction.md
          - Configuration: server/user-guide/configuration.md
          - Plugins: server/user-guide/plugins.md
          - Talker Alias: server/user-guide/talker-alias.md
          - Bridges and talkgroups: server/user-guide/bridges-and-talkgroups.md
          - Special numbers (4000, 999x, echo): server/user-guide/special-numbers.md
          - Private calls: server/user-guide/private-calls.md
          - Voice, announcements, and TTS: server/user-guide/voice-and-tts.md
          - Monitoring and reports: server/user-guide/monitoring.md
          - Report proxy (legacy dashboards): server/user-guide/report-proxy.md
          - Hotspot proxy (integrated): server/user-guide/hotspot-proxy.md
          - OBP proxy (OpenBridge fan-in): server/user-guide/obp-proxy.md
          - Echo (playback): server/user-guide/echo.md
          - Credits & license: server/user-guide/attribution.md
      - Protocols:
          - HBP (DMRD): server/protocols/hbp.md
          - OpenBridge (DMRE): server/protocols/openbridge.md
          - DMRE v5 frame layout: server/protocols/dmre-v5.md
          - Report protocol v2 (JSON): server/protocols/report-v2.md
      - Development:
          - Architecture: server/development/architecture.md
          - Performance (2.x): server/development/performance.md
          - BRIDGES vs Subscriptions: server/development/bridges-vs-subscriptions.md
          - Behaviour and timers: server/development/behaviour-and-timers.md
          - Voice routing and contention: server/development/routing-and-contention.md
          - Testing: server/development/testing.md
      - Contributing:
          - Translations: server/contributing/translations.md
  - Monitor:
      - Overview: monitor/index.md
      - Configuration (adn-monitor.yaml): monitor/configuration.md
      - Hotspot proxy: monitor/hotspot-proxy.md
      - Architecture and deployment: monitor/architecture.md
      - Self-service: monitor/self-service.md

extra:
  alternate:
    - name: English
      link: /docs/en/
      lang: en
    - name: Español
      link: /docs/es/
      lang: es
  social: []
