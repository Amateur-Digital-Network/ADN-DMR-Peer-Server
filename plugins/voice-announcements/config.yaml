# Scheduled announcements, TTS and voice beacons (moved out of the core).
# The items themselves stay where they were: VOICE.ANNOUNCEMENTS and
# VOICE.TTS_ANNOUNCEMENTS in adn-voice.yaml (re-read every 15 s).
enabled: true

# How often to follow changes in adn-voice.yaml, in seconds.
reconcile_s: 15

# Wait until the talkgroup has been quiet this long (no over starting or ending on it,
# from any hotspot, bridge or the mesh) before starting an announcement, in seconds.
# Longer than the usual pause between the overs of a QSO; 0 turns the wait off.
tg_quiet_s: 3
